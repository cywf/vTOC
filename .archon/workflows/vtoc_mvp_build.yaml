# Sample Archon workflow for vTOC MVP build
# This file should be placed under .archon/workflows/ in the vTOC repo.
# It defines the steps to build and publish the vTOC MVP Docker image.

workflow:
  name: vtoc-mvp-build
  triggers:
    - push:
        branches: ["archon/vtoc-mvp"]
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2
        - name: Login to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Build and push image
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: ghcr.io/cywf/vtoc-mvp:latest

# Note: The actual CI/CD pipeline is defined in .github/workflows/ but Archon consumes this YAML.
